# LHTB x EF — serial probe.
#
# One task, one arm, one attempt. The point is NOT a statistic: it is to confirm
# that the DSH adapter can enter an LHTB container, act through the official
# environment, and be graded by the official hidden verifier.
#
# ## Why serial — a CHOICE for this config, not a hardware limit
#
# This config stays at `n_concurrent_trials: 1` so a probe produces one clean cell
# whose log is easy to read, not because the host cannot do more.
#
# It used to say the opposite: "Every LHTB task requests 4-8 GB of RAM and this
# host's WSL VM is capped at 8 GB total, so at most one trial can run at a time.
# `n_concurrent_trials: 1` is a hardware limit, not a choice." Both halves were
# wrong in kind:
#
#   - `memory_mb` in a task.toml is the CONTAINER LIMIT, not a reservation.
#     Docker does not preallocate a cgroup limit, so two cells declared at 8 GiB
#     and 4 GiB do not consume 12 GiB.
#   - measured with both discriminators running, the two tasks held 193 MiB and
#     16 MiB against limits of 8 GiB and 4 GiB — roughly 200x under.
#
# The cap itself is a property of the HOST, not of this file, so no number for it
# appears here. Two revisions named one and each was a measurement of a different
# machine, and the second was wrong on the host that ran Phase 7 — that host grants
# more memory than the file claimed, which is why the number is now asked of the
# machine rather than written down. What is true of every host is the part that
# decides the question: a `memory_mb` is a limit and not a reservation, and the
# measured cells sit ~200x under their declared limits. Ask the host
# (`docker info --format '{{.MemTotal}}'`, or `~/.wslconfig`) when the figure
# matters; `tests/lhtb-parallelism.spec.ts` does, and skips rather than guesses on
# a host it cannot ask. The sweep config runs at 2; this one stays at 1 by choice.
#
# ## Why this task
#
# `unknown-config-semantics` is one of the two DISCRIMINATORS in
# bench/ef-selectbench-v1.json for this route (published reward 0.50). The
# saturated tasks were excluded precisely because they cannot show a difference.
#
# ## The arm
#
# Selected by `import_path` pointing at the EF agent module, so the LHTB checkout
# is never modified. EF_LHTB_ARM chooses the context runtime.
#
# Usage:
#   bash scripts/run-lhtb.sh probe                 # default arm: basic
#   EF_LHTB_ARM=economy bash scripts/run-lhtb.sh probe

job_name: lhtb-ef-probe
jobs_dir: ./jobs
n_attempts: 1
# Serial: see the memory note above. This is a host limit, not a preference.
n_concurrent_trials: 1
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - import_path: "ef_lhtb_agent:EFLhtbAgent"
    # A LABEL, not the route: run-lhtb.sh rewrites this line from
    # EF_LIVE_MODEL on every invocation, because Harbor prints it and a run
    # whose record names the wrong model describes something other than what
    # it measured. Do not read the value below as the route used.
    model_name: openai/space-bunny-free
    # ## Matches the task's OWN agent budget, deliberately
    #
    # The task declares `timeout_sec = 14400` (240 min) for its agent phase, so
    # this value is set to the same number rather than below it.
    #
    # It used to be 10800 (180 min), with the comment "the task's own agent
    # budget is the real limit; this bounds a runaway loop" — which contradicted
    # its own arithmetic, since 10800 < 14400 makes it TIGHTER than the budget it
    # claimed to defer to. The consequence was measured: in the Phase 6 probe
    # every timeout row sat at 180/181 minutes, so this cap, not the task, was
    # what ended those trials.
    override_timeout_sec: 14400

datasets:
  - path: ./tasks
    task_names:
      - unknown-config-semantics
