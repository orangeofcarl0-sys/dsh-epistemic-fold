# LHTB oracle — the tasks' own reference solutions.
#
# No API key. `oracle` is a Harbor built-in agent, so this never touches the EF
# adapter and never calls a model. It exists to answer three questions before any
# provider spend: do the images pull, do the containers start, and does the
# HIDDEN verifier score a completed run?
#
# A reward of 0 here is not a task failure. It is the environment failing, and
# the distinction matters: docs/33 lists LHTB as blocked, so this is the run that
# unblocks it or proves it is still blocked.
#
# The earlier revision of this file said a parallel run was impossible because
# "every LHTB task requests 4-8 GB of RAM and the WSL VM is capped at 8 GB". With
# both tasks running the measured usage was 193 MiB and 16 MiB against limits of
# 8 GiB and 4 GiB, so `memory_mb` is a limit and not a reservation.
#
# The cap is a property of the HOST and no number for it appears here. Two
# revisions of this file named one, and each was a measurement of a different
# machine; the later was wrong on the host that ran Phase 7, which grants more
# memory than the file claimed. Ask the host when the figure matters
# (`docker info --format '{{.MemTotal}}'`, or `~/.wslconfig`);
# tests/lhtb-parallelism.spec.ts does, and skips rather than guessing on a host it
# cannot ask. Two tasks run here at once with room for the build and verifier
# spikes, which is the part that is true of every host.
#
# Usage:
#   bash scripts/run-lhtb.sh oracle
job_name: lhtb-oracle
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 2
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true
  env:
    DOCKER_DEFAULT_PLATFORM: linux/amd64

agents:
  - name: oracle

datasets:
  - path: ./tasks
    task_names:
      - unknown-config-semantics
      - vector-db-iterative-build
