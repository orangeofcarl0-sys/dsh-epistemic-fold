# LHTB x EF — parallel arm sweep.
#
# ## What this is for
#
# The LongWork lane is the one that tests EF's actual claim: sustained work over
# hundreds of steps. This config runs every EF context runtime against the same
# tasks in ONE Harbor job, so the arms are interleaved by the benchmark's own
# scheduler rather than run back-to-back by us.
#
# ## Why this can be parallel at all
#
# Earlier revisions of this file said serial, on the grounds that "every LHTB task
# requests 4-8 GB of RAM and this host's WSL VM is capped at 8 GB". Both halves of
# that were wrong by the time it was written, and one is wrong in principle:
#
#   - the cap is a property of the HOST, and two revisions of this file named a
#     number for it. Each was a measurement of a different machine, and the second
#     was wrong on the host that ran Phase 7: that host grants more memory than the
#     file claimed, so the file understated the budget while a test enforced the
#     understatement. No number for it appears here now. Ask the host
#     (`docker info --format '{{.MemTotal}}'`, or `~/.wslconfig`) when it matters,
#     which is what tests/lhtb-parallelism.spec.ts does — skipping rather than
#     guessing on a host it cannot ask.
#   - `memory_mb` in a task.toml is the CONTAINER'S LIMIT, not a reservation.
#     Measured on this host with both tasks running: vector-db held 193 MiB of its
#     8 GiB limit and unknown-config 16 MiB of its 4 GiB. Docker does not
#     preallocate a cgroup limit.
#
# So the binding constraint is CPU and the build/verify spikes, not steady-state
# memory. `n_concurrent_trials` is therefore set from measurement, not from the
# declared limit.
#
# ## Why ONE job for all arms
#
# Harbor selects the agent by `import_path`, and the EF arm is read from the
# environment by the adapter. Running one arm per process was the old shape; it
# means four processes, four schedulers, and no interleaving, so a provider
# degradation during one arm's window is indistinguishable from a mode effect.
# One job per arm keeps that property. Splitting the ARMS into separate jobs here
# would be a regression in experimental design, not a speedup.
#
# ## Interleaving
#
# Harbor blocks on (task, replicate) and shuffles within the block, so an arm's
# exposure to provider drift is spread across the run rather than concentrated.
# n_attempts is the replicate count: Harbor treats each attempt as another trial
# of the same task, which is exactly the paired repeat the LHTB lane needs.
#
# ## The arm
#
# EF_LHTB_ARM still selects the runtime for the whole process. For a per-arm
# comparison run this file once per arm (scripts/run-lhtb.sh sweep does that).
#
# Usage:
#   bash scripts/run-lhtb.sh probe                 # one task, one arm (unchanged)
#   bash scripts/run-lhtb.sh sweep                 # this file, one arm
#   EF_LHTB_ARM=economy bash scripts/run-lhtb.sh sweep

job_name: lhtb-ef-sweep
jobs_dir: ./jobs
# ## 8, and why the count went UP rather than the clock coming down
#
# The agent phase of these tasks runs to a FIXED budget: vector-db carries
# continue_until_timeout = true, so it consumes the whole 4 hours by construction
# -- measured, 14400s and 14397s, against environment setup of 1.4s and a verifier
# of 1-24s. The wall clock is therefore a FLOOR, not a cost to be optimised: no
# amount of parallelism produces a round shorter than one agent budget.
#
# What CAN be improved is how much evidence that fixed window yields. Raise the
# replicate count and raise concurrency with it, and one 4-hour wave returns 8
# replicates per arm per task instead of 2. Eight concurrent cells were measured
# at ZERO 429s with providerFailures of 0-2; this is 32, which that measurement
# does not cover, so the round watches for throttling and the heartbeat exists to
# make a dead run visible.
#
# Memory is not what bounds this: at 192.8 MiB measured per cell, 32 cells hold
# ~6.4 GiB of the host's 23.47 GiB. The agent loop is also not CPU-bound -- it
# waits ~99s per model call over ~145 calls.
n_attempts: 8
# ## TWICE n_attempts, so a sweep is ONE wave
#
# A sweep is 2 tasks x n_attempts = 16 trials. At 16 concurrent they all run
# inside a single 4-hour agent budget, which is the shortest a sweep can be. At
# anything less the sweep takes ceil(16 / N) waves and the extra replicates are
# paid for in wall clock rather than won.
#
# The constraint this must respect is the HOST'S total across sweeps, and that is
# a property of the invocation rather than of this file: 2 sweeps (basic, economy)
# x 16 = 32 concurrent cells. Leave this at 16 and run more sweeps and the host
# carries proportionally more.
n_concurrent_trials: 16
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true
  env:
    DOCKER_DEFAULT_PLATFORM: linux/amd64

agents:
  - import_path: "ef_lhtb_agent:EFLhtbAgent"
    # A LABEL, not the route: run-lhtb.sh rewrites this line from
    # EF_LIVE_MODEL on every invocation, because Harbor prints it and a run
    # whose record names the wrong model describes something other than what
    # it measured. Do not read the value below as the route used.
    model_name: openai/space-bunny-free
    # ## Matches the task's OWN agent budget, deliberately
    #
    # The task declares `timeout_sec = 14400` (240 min) for its agent phase, so
    # this value is set to the same number rather than below it.
    #
    # It used to be 10800 (180 min), with the comment "the task's own agent
    # budget is the real limit; this bounds a runaway loop" — which contradicted
    # its own arithmetic, since 10800 < 14400 makes it TIGHTER than the budget it
    # claimed to defer to. The consequence was measured: in the Phase 6 probe
    # every timeout row sat at 180/181 minutes, so this cap, not the task, was
    # what ended those trials.
    override_timeout_sec: 14400

datasets:
  - path: ./tasks
    task_names:
      - unknown-config-semantics
      - vector-db-iterative-build
