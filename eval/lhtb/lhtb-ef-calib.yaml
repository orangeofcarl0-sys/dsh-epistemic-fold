# Gate E calibration: ONE cell, to MEASURE the turns a task actually consumes.
#
# unknown-config was launched on eight cells x four hours and produced an archive of
# zeros; the -70% budget shortfall was reconstructed afterwards from sec/call. The
# cheap version of that experiment is one cell, whose only job is to answer "how many
# model turns does this task take, and does that fit the budget it declares".
#
# Run one task per invocation by editing task_names, or pass --only style filtering
# upstream. n_attempts=1 and n_concurrent_trials=1 so nothing queues behind anything.
job_name: lhtb-ef-calib
jobs_dir: ./jobs
n_attempts: 2
n_concurrent_trials: 2
timeout_multiplier: 1.0

environment:
  type: docker
  # TRUE, and this is load-bearing. With force_build: false harbor REUSES an image whose
  # tag already exists locally, and the tags here are dated constants
  # (lhtb-unknown-config-semantics:20260729, lhtb-commit0-multilib-tdd:20260615). The
  # wave therefore ran July and June images: the probe pool and all five spec revisions
  # were readable on disk, and commit0 could not even import its own libraries. Every
  # fix in the Dockerfile was silently absent. Deleted the stale images as well, so the
  # next run cannot inherit them even if this setting regresses.
  force_build: true
  delete: false          # calibrating several tasks must not rebuild each time

agents:
  - import_path: "ef_lhtb_agent:EFLhtbAgent"
    model_name: openai/step-5-preview-free
  # The task's OWN declared budget, so the measurement reports whether it suffices
  # instead of hiding the answer behind an override.
    override_timeout_sec: 21600

datasets:
  - path: ./tasks
    task_names:
      - riscv-core-debug
