name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pinned-dsh:
    name: DSH 0.2.0-rc.2 (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          # The convergence gates verify ancestry and base SHAs (C0 327598f,
          # R38 0067020). A depth-1 checkout makes those objects absent and the
          # gates unverifiable, which is not the same as passing.
          fetch-depth: 0

      - name: Checkout vendored DSH at the verified baseline
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: vendor/deepseek-harness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install DSH workspace dependencies
        working-directory: vendor/deepseek-harness
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build DSH declaration output
        working-directory: vendor/deepseek-harness
        run: node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc -b packages/compaction/compaction-basic packages/core/tools packages/util/atomic-write

      - name: Install plugin tooling
        run: npm ci

      - name: Verify resolution maps are current
        run: node scripts/generate-maps.cjs --check

      - name: Verify the generated preset block is current
        # The reference is the PINNED checkout, not `~/.dsh`: a runner has no
        # installed profile, and a check against nothing is not a check. Strict:
        # a mismatch or a missing reference exits 2.
        run: >-
          node scripts/generate-presets.mjs --check
          --reference vendor/deepseek-harness/packages/bundle/web-app/presets

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      # The browser client face has its OWN project: it requires React from the
      # host loader, so it cannot join the main graph. Excluding it meant nothing
      # checked it, and it is the file every recent defect round touched.
      - name: Type check the browser client face
        run: npm run typecheck:client

      # The benchmark harness (`eval/`, `bench/`) had its own project for the
      # same reason: no tsconfig covered it, so it was never compiled. Adding
      # the project surfaced eleven errors, including an invalid
      # `CompactionTrigger` that would have thrown from Basic's `assertNever`
      # the moment the `basic` arm was fixed, and `lib/*.js` imports that
      # resolved to `any` and silenced the file.
      - name: Type check the benchmark harness
        run: npm run typecheck:eval

      # The SUPPORTED lane is blocking. It excludes twelve historical files whose
      # expectations belong to a different DSH line or to an external runner;
      # each one is still executed in the probe step below and stays visible.
      #
      #   bridge-loads              asserts a single version line
      #   checkpoint-residency      host API hardening (0.2.1)
      #   p0-regressions            host plugin-event transport
      #   persistence-compat        host persistence capability
      #   plugin-composition        host plugin-event transport
      #   rc3-plugin-packaging      declared peer range
      #   rc7-vendored-basic        vendored reference tree is not in the repo
      #   r38-native-context        persistence API line (apply vs install)
      #   lhtb-runner-dispatch      external runner binary
      #   r32-process-faults        lane-specific diagnostics semantics
      #   r35-live-failures         lane-specific provider accounting
      #   r36-agent-calibration     lane-specific finish-guard accounting
      - name: Tests — supported lane
        env:
          # The preset-drift test compares the checked-in block with a FIXED
          # DSH, not with whatever profile this machine happens to have.
          EF_DSH_REFERENCE: vendor/deepseek-harness/packages/bundle/web-app/presets
        run: >-
          npx vitest run
          --exclude tests/bridge-loads.spec.ts
          --exclude tests/checkpoint-residency.spec.ts
          --exclude tests/p0-regressions.spec.ts
          --exclude tests/persistence-compat.spec.ts
          --exclude tests/plugin-composition.spec.ts
          --exclude tests/rc3-plugin-packaging.spec.ts
          --exclude tests/rc7-vendored-basic.spec.ts
          --exclude tests/r38-native-context.spec.ts
          --exclude tests/lhtb-runner-dispatch.spec.ts
          --exclude tests/r32-process-faults.spec.ts
          --exclude tests/r35-live-failures.spec.ts
          --exclude tests/r36-agent-calibration.spec.ts

      # Visible, non-blocking: the excluded files run here with their real
      # results. A red probe is information, not a hidden removal.
      - name: Tests — historical probes (non-blocking)
        continue-on-error: true
        env:
          EF_DSH_REFERENCE: vendor/deepseek-harness/packages/bundle/web-app/presets
        run: >-
          npx vitest run
          tests/bridge-loads.spec.ts
          tests/checkpoint-residency.spec.ts
          tests/p0-regressions.spec.ts
          tests/persistence-compat.spec.ts
          tests/plugin-composition.spec.ts
          tests/rc3-plugin-packaging.spec.ts
          tests/rc7-vendored-basic.spec.ts
          tests/r38-native-context.spec.ts
          tests/lhtb-runner-dispatch.spec.ts
          tests/r32-process-faults.spec.ts
          tests/r35-live-failures.spec.ts
          tests/r36-agent-calibration.spec.ts

      - name: Keyless evaluation (metrics + boundary corpus + long-horizon economics)
        run: npm run eval:keyless

      - name: R1 model-aware context economics (attribution, workloads, ROI lab, policy, Pareto)
        run: npm run eval:r1

      - name: R2 baseline-dominant compression (pressure, admission, rebase, diet, dominance)
        run: npm run eval:r2

      - name: R1 report is reproducible and up to date
        run: |
          npm run eval:r1-report:check
          git diff --exit-code -- docs/12_R1_EVALUATION_REPORT.md docs/MANIFEST.json

      - name: Docs manifest is current
        run: node scripts/generate-docs-manifest.mjs --check

      # The live tier is opt-in and credential-gated. In CI it runs only when a
      # route is provided; without one every live test SKIPS (it never silently
      # passes), so the lane is safe to keep enabled.
      - name: R1 live tier (skips unless a route is configured)
        run: npm run eval:r1-live

  dsh-master:
    name: DSH master (compatibility probe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout vendored DSH at master
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: vendor/deepseek-harness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install DSH workspace dependencies
        working-directory: vendor/deepseek-harness
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build DSH declaration output
        working-directory: vendor/deepseek-harness
        run: node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc -b packages/compaction/compaction-basic packages/core/tools packages/util/atomic-write

      - name: Install plugin tooling
        run: npm ci

      - name: Regenerate resolution maps (master may add or move packages)
        run: node scripts/generate-maps.cjs

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type check the browser client face
        run: npm run typecheck:client

      # The benchmark harness (`eval/`, `bench/`) had its own project for the
      # same reason: no tsconfig covered it, so it was never compiled. Adding
      # the project surfaced eleven errors, including an invalid
      # `CompactionTrigger` that would have thrown from Basic's `assertNever`
      # the moment the `basic` arm was fixed, and `lib/*.js` imports that
      # resolved to `any` and silenced the file.
      - name: Type check the benchmark harness
        run: npm run typecheck:eval

      - name: Tests
        run: npx vitest run
