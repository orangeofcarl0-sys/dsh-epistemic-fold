name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pinned-dsh:
    name: DSH 0.1.7-rc.2 (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout vendored DSH at the verified baseline
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 477b4f420553e8a52c2fbccc464d7561b239c443
          path: vendor/deepseek-harness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install DSH workspace dependencies
        working-directory: vendor/deepseek-harness
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build DSH declaration output
        working-directory: vendor/deepseek-harness
        run: node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc -b packages/compaction/compaction-basic packages/core/tools packages/util/atomic-write

      - name: Install plugin tooling
        run: npm ci

      - name: Regenerate resolution maps and verify they are current
        run: |
          node scripts/generate-maps.cjs
          git diff --exit-code -- scripts/vendor-paths.json scripts/vendor-types-paths.json

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      # The browser client face has its OWN project: it requires React from the
      # host loader, so it cannot join the main graph. Excluding it meant nothing
      # checked it, and it is the file every recent defect round touched.
      - name: Type check the browser client face
        run: npm run typecheck:client

      # The benchmark harness (`eval/`, `bench/`) had its own project for the
      # same reason: no tsconfig covered it, so it was never compiled. Adding
      # the project surfaced eleven errors, including an invalid
      # `CompactionTrigger` that would have thrown from Basic's `assertNever`
      # the moment the `basic` arm was fixed, and `lib/*.js` imports that
      # resolved to `any` and silenced the file.
      - name: Type check the benchmark harness
        run: npm run typecheck:eval

      - name: Tests
        run: npx vitest run

      - name: Keyless evaluation (metrics + boundary corpus + long-horizon economics)
        run: npm run eval:keyless

      - name: R1 model-aware context economics (attribution, workloads, ROI lab, policy, Pareto)
        run: npm run eval:r1

      - name: R2 baseline-dominant compression (pressure, admission, rebase, diet, dominance)
        run: npm run eval:r2

      - name: R1 report is reproducible and up to date
        run: |
          npm run eval:r1-report
          git diff --exit-code -- docs/12_R1_EVALUATION_REPORT.md docs/MANIFEST.json

      # The live tier is opt-in and credential-gated. In CI it runs only when a
      # route is provided; without one every live test SKIPS (it never silently
      # passes), so the lane is safe to keep enabled.
      - name: R1 live tier (skips unless a route is configured)
        run: npm run eval:r1-live

  dsh-master:
    name: DSH master (compatibility probe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout vendored DSH at master
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: vendor/deepseek-harness

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install DSH workspace dependencies
        working-directory: vendor/deepseek-harness
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build DSH declaration output
        working-directory: vendor/deepseek-harness
        run: node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc -b packages/compaction/compaction-basic packages/core/tools packages/util/atomic-write

      - name: Install plugin tooling
        run: npm ci

      - name: Regenerate resolution maps (master may add or move packages)
        run: node scripts/generate-maps.cjs

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type check the browser client face
        run: npm run typecheck:client

      # The benchmark harness (`eval/`, `bench/`) had its own project for the
      # same reason: no tsconfig covered it, so it was never compiled. Adding
      # the project surfaced eleven errors, including an invalid
      # `CompactionTrigger` that would have thrown from Basic's `assertNever`
      # the moment the `basic` arm was fixed, and `lib/*.js` imports that
      # resolved to `any` and silenced the file.
      - name: Type check the benchmark harness
        run: npm run typecheck:eval

      - name: Tests
        run: npx vitest run
