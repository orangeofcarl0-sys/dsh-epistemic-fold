# dsh-epistemic-fold bundle patch (RC7): in-place preset substitution.
#
# ## What this does
#
# DSH's own agent presets, with ONE row changed: inside each preset's compaction
# group, `compaction-basic` is replaced by `dsh-epistemic-fold`. Everything else
# -- all 19 rows, the other groups, and the whole `minimal` preset -- is
# byte-identical to what DSH ships, and the preset menu is unchanged.
#
#   select "standard" / "ptc" / "cordis"  -> that session runs EF
#   select "minimal"                      -> untouched, exactly as DSH ships it
#
# ## Why in place, and not a top-level mount or EF's own presets
#
# Three shapes were measured against a real DSH 0.2.0-rc.2.
#
#   * A TOP-LEVEL EF plus de-isolated preset groups keeps the menu at four, but
#     `minimal` gains compaction it never shipped with, and the tool-result
#     pruner becomes unreachable -- the engine that calls it cannot see it, so
#     pruning stops silently. Both were measured.
#   * EF's OWN presets (RC5) are honest but add three menu items.
#   * IN PLACE changes only the backend: `minimal` stays empty, every preset
#     keeps its own pruner, and the engine is per-preset so `/context mode`
#     cannot leak across presets.
#
# ## Why the rows are restated
#
# The Loader cannot patch a row nested in a preset's `config.plugins`:
# `applyEntryPatches` indexes only rows with `group: true` AND an array `config`,
# and a preset's `config` is an object holding `plugins`. Nested ids are
# unaddressable and a patch cannot rename a row, so the preset's whole `config`
# must be restated. That makes this block VERSION-SPECIFIC.
#
# A patch whose target row is missing only WARNS and is skipped, so a DSH
# upgrade would silently leave the user on native Basic. EF's own boot-time
# self-check turns that into a loud error instead of a silent revert.
#
# ## Regenerating
#
#   node scripts/generate-presets.mjs [--dsh <path>] [--mode <tier>]
#
# Re-run after upgrading DSH, or automatically at install time via `prepare`.
# tests/rc7-inplace-drift.spec.ts fails when this block and the installed
# reference disagree.
#
# The markers below bound the generated region; everything outside them is
# hand-written and is never touched by the generator.

# ── the substitution doctor (hand-written; outside the generated block) ──────
#
# Mounted at the TOP level, deliberately NOT inside a preset. EF itself is
# mounted BY the substitution below — it is a row inside each preset's compaction
# group — so when the substitution misses, EF never mounts and a check living
# inside it can never run. That was the first version of this check, and it was
# unreachable on exactly the path it existed for (found by booting a deliberately
# broken install and observing that its log line never appeared).
#
# This entry therefore always mounts, and it is pure observation: no service, no
# projection, no state. It cannot report on folds, so it cannot reproduce the
# RC4-A defect (a mounted EF reporting while Basic folds). It reports on whether
# EF is INSTALLED, and says so loudly when the answer is no.
- insert:
    - id: epistemic-fold-doctor
      name: dsh-epistemic-fold

# >>> epistemic-fold preset overrides — GENERATED, do not edit
#
# DSH's own presets with the compaction backend replaced in place. The menu is
# unchanged and every other row is byte-identical to what DSH ships.
#
# Generated from the installed DSH by `node scripts/generate-presets.mjs` (mode: economy).
# Re-run after upgrading DSH; tests/rc7-inplace-drift.spec.ts fails when this
# block and the installed reference disagree.

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
            id: standard
            order: 1
            plugins:
              - id: persona
                name: '@deepseek-ai/dsh-persona'
                config:
                  suffix: Your working directory is {{cwd}}.
                  prefix: You are a coding agent powered by the {{model}} model.
              - id: agent-instructions
                name: '@deepseek-ai/dsh-agent-instructions'
                config:
                  maxBytes: 65536
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
              - id: tool-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  sampleOverCapGlobResults: false
              - id: tool-jobs
                name: '@deepseek-ai/dsh-tool-jobs'
              - id: skill-filesystem
                name: '@deepseek-ai/dsh-skill-filesystem'
              - id: tool-skill
                name: '@deepseek-ai/dsh-tool-skill'
              - id: command-goal
                name: '@deepseek-ai/dsh-command-goal'
              - id: tool-goal
                name: '@deepseek-ai/dsh-tool-goal'
              - id: planning
                name: cordis:group
                group: true
                isolate:
                  planMode: true
                config:
                  - id: plan-mode
                    name: '@deepseek-ai/dsh-plan-mode'
                    config:
                      section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
              - id: compaction
                name: cordis:group
                group: true
                isolate:
                  compaction: true
                  toolResultPruner: true
                  epistemicFold: true
                config:
                  - id: compaction-basic
                    name: dsh-epistemic-fold/plugin
                    config:
                      bundleRoot: null
                      mode: economy
                  - id: command-compact
                    name: '@deepseek-ai/dsh-command-compact'
                  - id: tool-result-pruner
                    name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                    config:
                      thresholdChars: 8192
                      headChars: 4096
                      tailChars: 1024
              - id: delegation
                name: cordis:group
                group: true
                isolate:
                  workflowEngine: true
                config:
                  - id: tool-subagent-control
                    name: '@deepseek-ai/dsh-tool-subagent-control'
                  - id: tool-subagent-list-agents
                    name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
                  - id: tool-subagent
                    name: '@deepseek-ai/dsh-tool-subagent'
                    config:
                      provider: spawn
                      toolName: subagent
                      modelSelectionSettings: true
                      backgroundMode: continuable
                  - id: tool-subagent-fork
                    name: '@deepseek-ai/dsh-tool-subagent'
                    config:
                      provider: fork
                      toolName: subagent_fork
                      backgroundMode: continuable
                  - id: tool-subagent-codex
                    name: '@deepseek-ai/dsh-tool-subagent'
                    disabled: true
                    config:
                      provider: codex
                      toolName: subagent_codex
                      backgroundMode: one-shot
                      maxDepth: provider-managed
                  - id: tool-subagent-claude-code
                    name: '@deepseek-ai/dsh-tool-subagent'
                    disabled: true
                    config:
                      provider: claude-code
                      toolName: subagent_claude_code
                      backgroundMode: one-shot
                      maxDepth: provider-managed
                  - id: workflow-ptc
                    name: '@deepseek-ai/dsh-workflow-ptc'
                    config:
                      provider: spawn
                  - id: tool-workflow
                    name: '@deepseek-ai/dsh-tool-workflow'
                  - id: tool-ralph
                    name: '@deepseek-ai/dsh-tool-ralph'
                    disabled: true
                    config:
                      subagentProvider: spawn
                      maxRounds: 64
              - id: tool-ask-user
                name: '@deepseek-ai/dsh-tool-ask-user'
              - id: tool-todo
                name: '@deepseek-ai/dsh-tool-todo'
                config:
                  allowParallelInProgress: true
              - id: tool-web
                name: '@deepseek-ai/dsh-tool-web'
                config:
                  fetch: true
                  searchTimeoutMs: 60000
              - id: present
                name: '@deepseek-ai/dsh-tool-present'
              - id: tool-plugin-manager
                name: '@deepseek-ai/dsh-plugin-manager/tools'
                disabled: true
