# dsh-epistemic-fold bundle patch (RC5): EF declares its OWN agent presets.
#
# ## What this replaces, and why
#
# Through RC4 this file mounted EF at the TOP level and disabled the top-level
# `compaction-basic`. That works in a preset-free profile (base + headless), and
# it is a NO-OP in the profile that has a sidebar: `dsh-web-app` already disables
# the top-level backend and puts a compaction group inside EACH agent preset,
# isolated by `isolate: {compaction: true}`. Cordis isolation means a scoped
# context resolves its own registration and never sees the parent's, so a
# top-level EF was invisible to every web session — and worse, its command and
# projection still reported folds EF never performed.
#
# ## What this does instead
#
# `package.json` declares a `dsh.bundle.patch` ARRAY, the same shape
# `dsh-web-app` uses for its four presets. Each entry declares one tier's preset,
# and each preset is a byte-for-byte copy of DSH's own reference preset EXCEPT
# for one row: inside the preset's isolated compaction group, `compaction-basic`
# is replaced by `epistemic-fold`.
#
#   select "EF · economy"  -> that session runs EF
#   select anything else   -> untouched native Basic, with NO EF surface at all
#
# The presets are GENERATED by `scripts/generate-presets.mjs` from the installed
# DSH build, so the 19 non-compaction rows (persona, tools, skills, instructions,
# ...) are a mirror rather than a hand-copy that would rot. Regenerate after a DSH
# upgrade; `tests/rc5-preset-drift.spec.ts` fails when the checked-in files and
# the installed reference disagree.
#
# ## Why not override DSH's presets in place
#
# The loader replaces a targeted row's WHOLE `config` rather than merging, so
# overriding `preset-standard` would mean restating its 136-row plugin list in a
# file that silently drifts. Declaring EF's own presets restates nothing of DSH's
# and leaves DSH's presets untouched.
#
# ## The tiers
#
# Three presets, not one, because a preset is chosen BEFORE a session starts and
# DSH refuses to recompose a running one — so the tier has to be the thing the
# user picks. `/context mode` remains meaningful where the composition is fixed
# at boot (headless/CLI); in a web session it is a read-only view.
#
# This file is deliberately EMPTY: the preset declarations live in
# `presets/*.patch.yml`, one per tier, listed in `package.json`'s
# `dsh.bundle.patch` array. Keeping them separate is what lets the generator
# rewrite a preset without touching anything hand-written.
